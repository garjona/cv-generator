[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-generator"
version = "0.1.0"
description = "Generador de CVs adaptados a ofertas laborales en español con salida HTML/CSS y Typst opcional"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel Aníbal Arjona Gálvez" }]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "Jinja2>=3.1.0",
  "python-docx>=1.1.0",
  "pypdf>=4.2.0",
  "pypdfium2>=4.30.0",
  "Pillow>=10.3.0",
  "python-dotenv>=1.0.0",
  "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
cv-generator = "cv_generator.interfaces.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

